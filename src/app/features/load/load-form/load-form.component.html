<div class="load-form">
  <div class="page-header">
    <h1>{{ isEdit ? 'Edit Load' : 'Create New Load' }}</h1>
  </div>

  <div class="card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label>Load Number *</label>
          <input type="text" formControlName="loadNumber" placeholder="e.g., LOAD-001" required>
          <span class="error" *ngIf="form.get('loadNumber')?.invalid && form.get('loadNumber')?.touched">
            Load number is required
          </span>
        </div>
        <div class="form-group">
          <label>Load Type *</label>
          <select formControlName="loadType" required>
            <option value="FTL">FTL (Full Truck Load)</option>
            <option value="PTL">PTL (Partial Truck Load)</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Status *</label>
          <select formControlName="status" required>
            <option value="Created">Created</option>
            <option value="Loaded">Loaded</option>
            <option value="In Transit">In Transit</option>
            <option value="Delivered">Delivered</option>
            <option value="Closed">Closed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Freight Amount *</label>
          <input type="number" formControlName="freightAmount" placeholder="0.00" required min="1" step="0.01">
          <span class="error" *ngIf="form.get('freightAmount')?.invalid && form.get('freightAmount')?.touched">
            Freight amount must be greater than 0
          </span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Source Location *</label>
          <input type="text" formControlName="sourceLocation" placeholder="e.g., New York" required>
          <span class="error" *ngIf="form.get('sourceLocation')?.invalid && form.get('sourceLocation')?.touched">
            Source location is required
          </span>
        </div>
        <div class="form-group">
          <label>Destination Location *</label>
          <input type="text" formControlName="destinationLocation" placeholder="e.g., Chicago" required>
          <span class="error" *ngIf="form.get('destinationLocation')?.invalid && form.get('destinationLocation')?.touched">
            Destination location is required
          </span>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="!form.valid">
          {{ isEdit ? 'Update Load' : 'Create Load' }}
        </button>
        <button type="button" (click)="onCancel()" class="btn btn-secondary">Cancel</button>
      </div>
    </form>
  </div>
</div>
