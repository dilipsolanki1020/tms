<div class="party-form">
  <h1>Create New Party</h1>

  <div class="card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label>Name</label>
          <input type="text" formControlName="name" required>
        </div>
        <div class="form-group">
          <label>Type</label>
          <select formControlName="type" required>
            <option value="Company">Company</option>
            <option value="Distributor">Distributor</option>
            <option value="Individual">Individual</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" required>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" formControlName="phone" required>
        </div>
      </div>

      <div class="form-group">
        <label>Address</label>
        <input type="text" formControlName="address" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>City</label>
          <input type="text" formControlName="city" required>
        </div>
        <div class="form-group">
          <label>State</label>
          <input type="text" formControlName="state" required>
        </div>
        <div class="form-group">
          <label>Zip Code</label>
          <input type="text" formControlName="zipCode">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Credit Limit</label>
          <input type="number" formControlName="creditLimit" required>
        </div>
        <div class="form-group">
          <label>Outstanding Amount</label>
          <input type="number" formControlName="outstandingAmount" value="0">
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="!form.valid">Create Party</button>
        <button type="button" (click)="onCancel()" class="btn btn-secondary">Cancel</button>
      </div>
    </form>
  </div>
</div>
