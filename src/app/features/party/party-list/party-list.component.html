<div class="page-container">
  <div class="page-header">
    <h1>Party Management</h1>
    <a routerLink="/party/create" class="btn btn-primary">+ Add Party</a>
  </div>

  <div class="data-card">
    <div class="table-container">
      <table *ngIf="parties.length > 0; else noParties" class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Credit Limit</th>
            <th>Outstanding</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let party of parties">
            <td>{{ party.name }}</td>
            <td>{{ party.type }}</td>
            <td>{{ party.email }}</td>
            <td>{{ party.phone }}</td>
            <td>{{ party.creditLimit | currency }}</td>
            <td>{{ party.outstandingAmount | currency }}</td>
            <td class="action-cell">
              <a [routerLink]="['/party', party.id]" class="btn btn-secondary btn-sm">View</a>
              <a [routerLink]="['/party', party.id, 'edit']" class="btn btn-info btn-sm">Edit</a>
              <button (click)="deleteParty(party.id)" class="btn btn-danger btn-sm">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
      <ng-template #noParties>
        <p class="no-data">No parties found. <a routerLink="/party/create" class="link-primary">Create one</a></p>
      </ng-template>
    </div>
  </div>
</div>
