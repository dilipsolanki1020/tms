<div class="vehicle-form">
  <div class="page-header">
    <h1>{{ isEdit ? 'Edit Vehicle' : 'Add New Vehicle' }}</h1>
  </div>

  <div class="card">
    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Vehicle Details -->
      <div class="form-section">
        <h3>Vehicle Details</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Registration Number <span class="required">*</span></label>
            <input type="text" formControlName="registrationNumber" placeholder="e.g., TN-01-AB-1234" required>
            <span class="error" *ngIf="form.get('registrationNumber')?.invalid && form.get('registrationNumber')?.touched">
              {{ getFieldError('registrationNumber') }}
            </span>
          </div>
          <div class="form-group">
            <label>Vehicle Type <span class="required">*</span></label>
            <select formControlName="vehicleType" required>
              <option value="Truck">Truck</option>
              <option value="Trailer">Trailer</option>
              <option value="Van">Van</option>
              <option value="Lorry">Lorry</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Capacity (Tonnes) <span class="required">*</span></label>
            <input type="number" formControlName="capacity" placeholder="e.g., 15" required min="1" max="100" step="0.5">
            <small>Maximum capacity this vehicle can carry (1-100 tonnes)</small>
            <span class="error" *ngIf="form.get('capacity')?.invalid && form.get('capacity')?.touched">
              {{ getFieldError('capacity') }}
            </span>
          </div>
          <div class="form-group">
            <label>Owner Type <span class="required">*</span></label>
            <select formControlName="owner" required>
              <option value="Owned">Owned</option>
              <option value="Market">Market (Rented)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Status -->
      <div class="form-section">
        <h3>Status</h3>
        <div class="form-group">
          <label>Availability Status <span class="required">*</span></label>
          <select formControlName="availabilityStatus" required>
            <option value="Available">Available</option>
            <option value="In Transit">In Transit</option>
            <option value="Under Maintenance">Under Maintenance</option>
          </select>
          <small>Current status of the vehicle</small>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="!form.valid || submitLoading">
          <span *ngIf="submitLoading">Saving...</span>
          <span *ngIf="!submitLoading">{{ isEdit ? 'Update Vehicle' : 'Create Vehicle' }}</span>
        </button>
        <button type="button" (click)="onCancel()" class="btn btn-secondary" [disabled]="submitLoading">Cancel</button>
      </div>
    </form>
  </div>
</div>
