<div class="page-container">
  <div class="page-header">
    <h1>Vehicle Management</h1>
    <a routerLink="/vehicle/create" class="btn btn-primary">+ Add Vehicle</a>
  </div>

  <div class="data-card">
    <div class="table-container">
      <table *ngIf="vehicles.length > 0; else noVehicles" class="data-table">
        <thead>
          <tr>
            <th>Registration #</th>
            <th>Type</th>
            <th>Capacity (Tons)</th>
            <th>Owner</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let vehicle of vehicles">
            <td>{{ vehicle.registrationNumber }}</td>
            <td>{{ vehicle.vehicleType }}</td>
            <td>{{ vehicle.capacity }}</td>
            <td>{{ vehicle.owner }}</td>
            <td><span class="status-badge" [ngClass]="getBadgeClass(vehicle.availabilityStatus)">{{ vehicle.availabilityStatus }}</span></td>
            <td class="action-cell">
              <a [routerLink]="['/vehicle', vehicle.id]" class="btn btn-secondary btn-sm">View</a>
              <button (click)="deleteVehicle(vehicle.id)" class="btn btn-danger btn-sm">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
      <ng-template #noVehicles>
        <p class="no-data">No vehicles found. <a routerLink="/vehicle/create" class="link-primary">Add one</a></p>
      </ng-template>
    </div>
  </div>
</div>
